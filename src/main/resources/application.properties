spring.application.name=cloud-compute-service
server.port=8080

# Time for the server to receive the request headers (10 seconds)
server.tomcat.header-timeout=10000
# Total time for the connector to wait for a request after a connection is opened (20 seconds)
server.tomcat.connection-timeout=20000
# Max size for headers (helps use large JWTs)
server.max-http-header-size=16KB

management.endpoints.web.exposure.include=health,info
spring.profiles.active=dev
server.error.include-message=always
server.error.include-binding-errors=always
spring.jackson.time-zone=UTC


jwt.private-key-path=classpath:cert/ECDSA_384_private.pem
jwt.public-key-path=classpath:cert/ECDSA_384_public.pem
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
